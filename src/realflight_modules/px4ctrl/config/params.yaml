# OMMPC 八字专用配置；本轮改动行标注旧翻转值。
# 切回翻转请整套加载 params_ommpc_flip.yaml，再选 vertical_circle / helix。
# 仅改 trajectory.type 不会自动切换 PID、前馈和预测模型。
px4ctrl_node:
  ros__parameters:
    # sun: 外环与内环频率分别对应两个 ROS 2 节点，滤波器设计也使用这两个采样频率。
    ctrl_freq_max : 100.0
    # 内外环联合调参后保留 400 Hz；提高频率并不一定改善闭环效果。
    ratectrl_freq_max : 400.0

    gra    : 9.805

    # All controllers use the same source. Selection/parameters take effect after restart.
    trajectory:
      type: vertical_circle  # 旧: vertical_circle ；可选 horizontal_circle / vertical_circle / helix / figure_eight / omtraj
      takeoff_height: 1.5 # relative to CMD activation position [m]
      takeoff_duration: 3.0
      settle_duration: 0.5
      horizontal_circle:
        radius: 1.0      # main circle diameter <= 2 m, enforced by generator
        turns: 2         # cruise turns; acceleration/deceleration add phase
        speed: 1.5
        ramp_duration: 3.0
      vertical_circle:
        radius: 0.9
        turns: 1
        centripetal_g: 1.8 # A/g > 1; slowing arbitrarily destroys inversion
        entry_duration: 0.85
        exit_duration: 0.85
        entry_distance: 1.35
        exit_distance: 1.35
        connector_height: 1.1 # hover endpoints above circle bottom [m]
      helix:
        radius: 1.0
        turns: 2
        axis_transition_duration: 1.0
        pitch: 0.5       # axial advance per revolution [m], not m/s
        centripetal_g: 1.8
        entry_duration: 0.85
        exit_duration: 0.85
        entry_distance: 1.43
        exit_distance: 1.43
        connector_height: 1.1
      figure_eight:
        length: 2.0      # full bounding-box dimensions [m]
        width: 1.2
        turns: 2         # total complete laps, including phase ramps
        speed: 1.5       # upper bound on path speed [m/s]
        ramp_duration: 3.0
      limits:
        motor_fraction: 0.7 # static single-motor maximum budget
        angular_acceleration: 100.0 # nominal body angular acceleration norm [rad/s^2]
        minimum_relative_altitude: -0.01
      point_to_point:
        max_speed: 1.0
        max_acceleration: 1.5
      omtraj:
        file: datalog/omtraj/omtraj_manifold_v2.csv

    # SO(3) 误差 QP；内环与推力响应纳入预测。参数读取后重启生效。
    mpc:
      horizon: 16
      prediction_dt: 0.03       # 0.48 s 预瞄，外环仍为 100 Hz
      # 与下方内环成组验证的八字模型；近似匹配公式不能替代闭环复测。
      rate_time_constant: [0.10, 0.083, 0.25] # 旧翻转: [0.08, 0.06666666666666667, 0.125]
      thrust_time_constant: 0.033
      drag_compensation: true  # aero 系数与预测/参考补偿共用，假定无风
      body_rate_max: [14.0, 14.0, 14.0]
      # 顺序 p(3), v(3), SO(3)(3)；联合调参保留位置权重 300。
      state_weight: [300.0, 300.0, 300.0, 6.0, 6.0, 8.0, 3.0, 3.0, 2.0]
      rate_weight: 0.05
      thrust_weight: 0.01
      input_weight: [0.10, 0.12, 0.12, 0.12]
      command_change_weight: [0.02, 0.08, 0.08, 0.08] # 首条命令相对上次执行量
      terminal_weight_scale: 2.0
      maximum_iterations: 200
      tolerance: 1.0e-4
      solve_time_budget_ms: 6.0 # 包含建模的预算检查；非硬实时抢占

    # acados 运行时参数：修改后重启节点即可，不需要生成代码或重新编译。
    nmpc:
      horizon: 12                 # 预测步数，可运行时配置（1..200）
      prediction_dt: 0.04          # 预测间隔 [s]，独立于外环周期
      # 角速度闭环响应的近似时间常数 [s]；不是纯延迟，须 >= prediction_dt。
      # 改内环增益/滤波/电机后应重新辨识，不要用调大 Qp 来弥补模型误差。
      rate_time_constant: [0.10, 0.083, 0.25]
      drag_compensation: true      # 预测/参考补偿共用 aero.kd*/kh 与 uav.mass，假定无风
      maximum_iterations: 60
      tolerance: 1.0e-5
      solve_time_budget_ms: 8.0    # SQP 迭代间检查，不是硬实时抢占
      body_rate_max: [14.0, 14.0, 14.0]
      # 离散累加代价，不额外乘 dt；顺序 p(3), v(3), q_wxyz(4)
      state_weight: [100.0, 100.0, 100.0, 3.0, 3.0, 3.0, 5.0, 5.0, 5.0, 5.0]
      terminal_weight: [35.0, 35.0, 35.0, 6.0, 6.0, 6.0, 10.0, 10.0, 10.0, 10.0]
      input_weight: [0.10, 0.12, 0.12, 0.12]  # a_T, omega_xyz
      command_change_weight: [0.02, 0.12, 0.12, 0.12]  # u0 与上周期实际命令的差
      # 求解失败当帧启用反馈回退；不保持旧角速度。重力沿用 gra，推力界限由电机/质量计算。
      fallback_position_gain: [2.5, 2.5, 2.5]
      fallback_velocity_gain: [3.0, 3.0, 3.0]
      fallback_attitude_gain: 4.0

    # sun: 刚体参数使用 SI 单位；惯量是机体系主轴对角项，机臂角从 +x 轴量起。
    uav:
      mass  : 0.811
      Jvx   : 1.91e-3 # kgm^2
      Jvy   : 2.37e-3
      Jvz   : 3.60e-3
      l     : 0.1216  # m 
      rp    : 0.06475 # m（5.1寸桨半径）
      beta_deg  : 45.0  # deg（机架和x轴夹角）

    motor:
      # sun: Cq/Ct 多项式的自变量是前进比 J，rc2speed 则把归一化油门映射为 rad/s。
      # cq    : 1.8346e-8 # Nm^2，1.8899e-8
      Cq_a  : -0.0275
      Cq_b  : 0.0017
      Cq_c  : 0.0164
      # ct    : 1.7368e-6 # N^2，1.6582e-6
      Ct_a  : -0.1861
      Ct_b  : -0.1392
      Ct_c  : 0.1862

      rc2speed_a: -92.209
      rc2speed_b: 3995.891
      rc2speed_c: 291.082
      # u_min : 0.0 # N 由rc2speed_c来决定
      # u_max : 13.9254

    # 滤波器
    filter:
      lpf_acc_x_cutoff_hz : 10.0
      lpf_acc_y_cutoff_hz : 10.0
      lpf_acc_z_cutoff_hz : 10.0
      # 陀螺低通仅用于内环监视；当前 P 用原始角速度，D 用 TVR 角加速度估计。
      lpf_gyro_x_cutoff_hz : 10.0
      lpf_gyro_y_cutoff_hz : 10.0
      lpf_gyro_z_cutoff_hz : 10.0
    # sun: 增益按位置、速度、姿态、角速度四层串级控制器分组，三轴可独立调节。
    gain:
      gain_pos_x   : 2.5
      gain_pos_y   : 1.5
      gain_pos_z   : 1.5
      gain_vel_p_x   : 4.0
      gain_vel_p_y   : 3.0
      gain_vel_p_z   : 2.5
      gain_vel_i_x   : 0.8
      gain_vel_i_y   : 0.8
      gain_vel_i_z   : 0.5
      gain_vel_d_x   : 0.2
      gain_vel_d_y   : 0.2
      gain_vel_d_z   : 0.0
      gain_quat_x   : 12.0 # 7.0
      gain_quat_y   : 13.0 # 8.0
      gain_quat_z   : 2.0 # 2.0
      # 与 mpc.rate_time_constant 联合验证；不要只改 P 而保留旧响应模型。
      gain_rate_p_x : 10.0 # 旧翻转: 20.0
      gain_rate_p_y : 12.0 # 旧翻转: 24.0
      gain_rate_p_z : 4.0 # 旧翻转: 8.0
      gain_rate_i_x : 3.0
      gain_rate_i_y : 3.0
      gain_rate_i_z : 0.5
      gain_rate_d_x : 0.05 # 旧翻转: 0.6
      gain_rate_d_y : 0.05 # 旧翻转: 0.6
      gain_rate_d_z : 0.0
      # 八字采用单位前馈；翻转原值为 [1.6,1.6,1.0]，须与 P/D/tau 成组切换。
      gain_rate_ff_x : 1.0 # 旧翻转: 1.6
      gain_rate_ff_y : 1.0 # 旧翻转: 1.6
      gain_rate_ff_z : 1.0

    # sun: 气动力在机体系计算；kdx/kdy/kdz 为线性阻力项，kh 为水平速度耦合竖直项。
    aero:
      rho   : 1.1
      kdx   : 0.26  # kg/s
      kdy   : 0.28  # kg/m
      kdz   : 0.42  
      kh    : 0.01
    # kdx   : 0.0  # kg/s
    # kdy   : 0.0  # kg/m
    # kdz   : 0.0  
    # kh    : 0.0

    # RC
    rc_reverse:
      roll: true 
      pitch: true 
      yaw: false 
      throttle: true

    tuning:
      # sun: 两个调参开关会覆盖正常参考，仅用于系留或安全试验环境中的单环响应测试。
      attitude_loop: false # 姿态环调参
      euler_des_x_deg: 0.0    # 期望姿态角(deg)，仅在attitude_loop=true时有效
      euler_des_y_deg: 0.0
      euler_des_z_deg: 0.0
      angular_rate_loop: false # 角速度环调参
      rate_des_x_deg: 57.3    # 期望角速度(deg/s)，仅在angular_rate_loop=true时有效
      rate_des_y_deg: 0.0
      rate_des_z_deg: 0.0
