omtraj_visualizer:
  ros__parameters:
    frame_id: map
    output:
      save_trajectory: true
      trajectory_file: datalog/omtraj/omtraj_manifold_v2.csv
    waypoint_count: 12
    waypoint_tolerance: 0.12
    waypoints:
      point_0: [0.5886, 0.9989, 0.9305]
      point_1: [1.1184, -0.5748, 1.0429]
      point_2: [1.2635, -1.34, 1.1893]
      point_3: [2.0496, 0.733, 1.4791]
      point_4: [-0.2007, 1.9261, 0.6898]
      point_5: [-0.796, 0.4313, 0.962]
      point_6: [-0.4429, 0.0294, 1.2289]
      point_7: [0.6988, 0.6516, 1.3411]
      point_8: [-0.0879, 1.6522, 1.48]
      point_9: [-1.9025, -0.2339, 0.9784]
      point_10: [0.3712, -1.4083, 0.9918]
      point_11: [1.5784, -0.0564, 0.6665]
      # Optional tilt_0 ... tilt_11: waypoint-only body-z cone, radians.
      # Unspecified cones allow all attitudes; global envelope is in the other YAML.
    initial:
      position: [0.0, 0.0, 0.55]
      velocity: [0.0, 0.0, 0.0]
      yaw: 0.0
    terminal:
      position: [0.0, 0.0, 0.55]
      velocity: [0.0, 0.0, 0.0]
      yaw: 0.0
    model:
      gravity: 9.805
      linear_drag: [0.3205918618988903, 0.34525277435265106, 0.5178791615289765]
      horizontal_lift: 0.012330456226880395
    limits:
      waypoint_margin: 0.05  # shrink 12 cm task spheres to 7 cm; reserve 5 cm for tracking
      thrust_min: 1.0
      thrust_max: 30.0       # m/s^2, with feedback reserve
      rate_max: [4.0, 4.0, 4.0] # rad/s per axis
      thrust_slew_max: 40.0  # m/s^3
      angular_acceleration_max: [16.0, 16.0, 16.0] # rad/s^2 per axis
      speed_max: 6.0         # m/s
      # First-order thrust-command budget.
      thrust_time_constant: 0.033
      maximum_tilt: 1.5707963267948966 # radians; waypoint cones still apply
      minimum_relative_altitude: 0.0
      mass: 0.811
      inertia: [0.00191, 0.00237, 0.00360]
      arm: 0.1216
      arm_angle: 0.7853981633974483
      torque_to_thrust: 0.011406015037593987
      motor_min: 0.5         # N, above physical idle to reserve feedback authority
      motor_max: 17.972347331460142 # 70% of static model maximum
    optimizer:
      # Manuscript III: one joint free-time SCP, right SO(3) increments and CSTC.
      # No outer bisection or locked passage schedule. T is the sole physical cost.
      intervals: 40
      max_scp_iterations: 80
      integration_substeps: 12
      minimum_time: 0.5
      maximum_time: 30.0
      initial_speed: 2.5        # initialization only; NOT a speed constraint
      optimize_total_time: true
      enforce_hover_boundary_input: true
      # Independent high-resolution validation: m, m/s, rad per shooting interval.
      position_tolerance: 0.00002
      velocity_tolerance: 0.00002
      attitude_tolerance: 0.00002
      constraint_tolerance: 0.00002
      cstc_tolerance: 0.000001
      # Exact L1 virtual-control epigraph; raise penalty only on restoration stagnation.
      virtual_control_weight: 10.0
      maximum_virtual_control_weight: 1000.0
      cstc_merit_weight: 100.0
      # Increment regularization is numerical, not a control effort/smoothness cost.
      state_regularization: 0.02
      progress_regularization: 0.1
      store_history: false
    visualization:
      marker_topic: omtraj/markers
      vehicle_publish_rate_hz: 15.0
      vehicle_playback_speed: 1.0
      final_display_samples: 240
      trajectory_width: 0.055
      thrust_arrow_stride: 1
      thrust_arrow_scale: 0.03
