omtraj_visualizer:
  ros__parameters:
    frame_id: map
    output:
      save_trajectory: true
      trajectory_file: datalog/omtraj/omtraj_manifold_v2.csv
    waypoint_count: 7
    waypoint_tolerance: 0.12
    waypoints:
      point_0: [1.0, 0.5, 1.0]
      point_1: [2.4, -0.8, 1.5]
      point_2: [2.0, 1.5, 2.0]
      point_3: [1.0, 0.9, 2.5]
      point_4: [-1.0, 0.0, 2.5]
      point_5: [0.0, -1.5, 1.5]
      point_6: [2.0, 0.0, 2.0]
      # Optional tilt_0 ... tilt_6: waypoint-only body-z cone, radians.
      # Unspecified cones allow all attitudes; global envelope is in the other YAML.
    initial:
      position: [0.0, 0.0, 1.0]
      velocity: [0.0, 0.0, 0.0]
      yaw: 0.0
    terminal:
      position: [1.0, 1.0, 1.5]
      velocity: [0.0, 0.0, 0.0]
      yaw: 0.0
    optimizer:
      # Manuscript III: one joint free-time SCP, right SO(3) increments and CSTC.
      # No outer bisection or locked passage schedule. T is the sole physical cost.
      intervals: 40
      max_scp_iterations: 80
      integration_substeps: 12
      minimum_time: 0.5
      maximum_time: 30.0
      initial_speed: 2.5        # initialization only; NOT a speed constraint
      optimize_total_time: true
      enforce_hover_boundary_input: true
      # Independent high-resolution validation: m, m/s, rad per shooting interval.
      position_tolerance: 0.00002
      velocity_tolerance: 0.00002
      attitude_tolerance: 0.00002
      constraint_tolerance: 0.00002
      cstc_tolerance: 0.000001
      # Exact L1 virtual-control epigraph; raise penalty only on restoration stagnation.
      virtual_control_weight: 10.0
      maximum_virtual_control_weight: 1000.0
      cstc_merit_weight: 100.0
      # Increment regularization is numerical, not a control effort/smoothness cost.
      state_regularization: 0.02
      progress_regularization: 0.1
      store_history: false
    visualization:
      marker_topic: omtraj/markers
      vehicle_publish_rate_hz: 15.0
      vehicle_playback_speed: 1.0
      final_display_samples: 240
      trajectory_width: 0.055
      thrust_arrow_stride: 1
      thrust_arrow_scale: 0.03
